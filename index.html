<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sailaa vet | Résumés et examens PDF gratuits pour étudiants</title>
<meta name="description" content="sailaa vet : site pédagogique gratuit pour les étudiants universitaires. Résumés et examens des années précédentes en PDF (médecine vétérinaire).">
<meta property="og:title" content="sailaa vet | Résumés et examens PDF gratuits pour étudiants">
<meta property="og:description" content="Résumés et examens des années précédentes en PDF, gratuitement.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f6f8f5;--card:#fff;--text:#1d2b22;--muted:#5d6f63;--brand:#1f7a4d;--brand2:#e3f3ea;--line:#dbe4dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a2520;--text:#e8f1ea;--muted:#9bb0a2;--brand:#4cc38a;--brand2:#1f3329;--line:#2b3b32}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a2520;--text:#e8f1ea;--muted:#9bb0a2;--brand:#4cc38a;--brand2:#1f3329;--line:#2b3b32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:auto;padding:0 16px}
header{padding:48px 0 28px;text-align:center}
.logo{font-size:2rem;font-weight:800;color:var(--brand);letter-spacing:.5px}
header p{color:var(--muted);max-width:560px;margin:8px auto 0}
.badge{display:inline-block;background:var(--brand2);color:var(--brand);padding:2px 12px;border-radius:99px;font-size:.85rem;margin-top:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.05rem}
.card small{color:var(--muted)}
.tag{align-self:flex-start;background:var(--brand2);color:var(--brand);font-size:.78rem;padding:1px 10px;border-radius:99px}
.btns{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.btns a{flex:1;text-align:center;padding:8px;border-radius:9px;text-decoration:none;font-size:.92rem;border:1px solid var(--brand);color:var(--brand)}
.btns a.main{background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px}
h2{margin:8px 0 14px;font-size:1.3rem;border-left:4px solid var(--brand);padding-left:10px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 0 40px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">sailaa vet</div>
  <p>Résumés et examens des années précédentes en PDF, gratuits pour les étudiants universitaires. Téléchargez, révisez, réussissez.</p>
  <span class="badge">100 % gratuit</span>
</header>

<div class="tools"><input id="q" type="search" placeholder="Rechercher un résumé, un examen ou une matière…" aria-label="Recherche"></div>

<h2 id="summaries">Résumés</h2>
<div class="chips" id="chips"></div>
<div class="grid" id="list"></div>

<h2 id="exams">Examens des années précédentes</h2>
<div class="chips" id="echips"></div>
<div class="grid" id="elist"></div>

<footer>© sailaa vet — Contenu pédagogique gratuit pour les étudiants</footer>
</div>

<script>
const ALL="Tous";
function esc(x){return x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function card(i,sub){return `<div class="card"><span class="tag">${esc(i.tag)}</span><h3>${esc(i.t)}</h3><small>${esc(sub)}</small><div class="btns"><a class="main" href="${esc(i.url)}" target="_blank" rel="noopener">Consulter</a><a href="${esc(i.url)}" target="_blank" rel="noopener">Télécharger</a></div></div>`}

// ===== Pour ajouter un résumé : ajoutez une ligne ici et mettez le lien du PDF dans url =====
const SUMMARIES=[
  {t:"Résumé d’anatomie vétérinaire",s:"Anatomie",y:"1re année",url:"#"},
  {t:"Résumé de physiologie cardiovasculaire",s:"Physiologie",y:"2e année",url:"#"},
  {t:"Résumé de pharmacologie",s:"Pharmacologie",y:"3e année",url:"#"},
  {t:"Résumé de microbiologie",s:"Microbiologie",y:"2e année",url:"#"},
  {t:"Résumé de parasitologie",s:"Parasitologie",y:"3e année",url:"#"},
  {t:"Résumé de chirurgie vétérinaire",s:"Chirurgie",y:"4e année",url:"#"}
];
// ===== Pour ajouter un examen : ajoutez une ligne (sol:true s’il y a le corrigé) =====
const EXAMS=[
  {t:"Examen d’anatomie vétérinaire",s:"Anatomie",y:"2025",sol:true,url:"#"},
  {t:"Examen de physiologie cardiovasculaire",s:"Physiologie",y:"2025",url:"#"},
  {t:"Examen de pharmacologie",s:"Pharmacologie",y:"2024",sol:true,url:"#"},
  {t:"Examen de microbiologie",s:"Microbiologie",y:"2024",url:"#"},
  {t:"Examen de parasitologie",s:"Parasitologie",y:"2023",url:"#"},
  {t:"Examen de chirurgie vétérinaire",s:"Chirurgie",y:"2023",sol:true,url:"#"}
];

const q=document.getElementById("q");
let cat=ALL,ey=ALL;
const chips=document.getElementById("chips"),list=document.getElementById("list");
const echips=document.getElementById("echips"),elist=document.getElementById("elist");
const cats=[ALL,...new Set(SUMMARIES.map(l=>l.s))];
const eyears=[ALL,...[...new Set(EXAMS.map(e=>e.y))].sort().reverse()];
const chipHtml=(arr,on)=>arr.map(c=>`<button class="chip ${c===on?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
const none=m=>`<div class="empty" style="grid-column:1/-1">${m}</div>`;

function drawS(){
  chips.innerHTML=chipHtml(cats,cat);
  const k=q.value.trim().toLowerCase();
  const r=SUMMARIES.filter(l=>(cat===ALL||l.s===cat)&&(l.t+l.s).toLowerCase().includes(k));
  list.innerHTML=r.length?r.map(l=>card({...l,tag:l.s},l.y+" · PDF")).join(""):none("Aucun résumé trouvé.");
}
function drawE(){
  echips.innerHTML=chipHtml(eyears,ey);
  const k=q.value.trim().toLowerCase();
  const r=EXAMS.filter(e=>(ey===ALL||e.y===ey)&&(e.t+e.s).toLowerCase().includes(k));
  elist.innerHTML=r.length?r.map(e=>card({...e,tag:e.y},e.s+" · PDF"+(e.sol?" · avec corrigé":""))).join(""):none("Aucun examen trouvé.");
}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;drawS()}});
echips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){ey=b.dataset.c;drawE()}});
q.addEventListener("input",()=>{drawS();drawE()});
drawS();drawE();
</script>
</body>
</html>
