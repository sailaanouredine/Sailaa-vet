<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sailaa vet | دروس PDF مجانية لطلبة الجامعة</title>
<meta name="description" content="sailaa vet: موقع تعليمي مجاني لطلبة الجامعة، دروس PDF وامتحانات السنوات السابقة في الطب البيطري.">
<meta property="og:title" content="sailaa vet | دروس PDF مجانية لطلبة الجامعة">
<meta property="og:description" content="دروس PDF وامتحانات السنوات السابقة، مجانًا.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f6f8f5;--card:#fff;--text:#1d2b22;--muted:#5d6f63;--brand:#1f7a4d;--brand2:#e3f3ea;--line:#dbe4dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a2520;--text:#e8f1ea;--muted:#9bb0a2;--brand:#4cc38a;--brand2:#1f3329;--line:#2b3b32}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a2520;--text:#e8f1ea;--muted:#9bb0a2;--brand:#4cc38a;--brand2:#1f3329;--line:#2b3b32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:auto;padding:0 16px}
header{padding:48px 0 28px;text-align:center}
.logo{font-size:2rem;font-weight:800;color:var(--brand);letter-spacing:.5px;direction:ltr}
header p{color:var(--muted);max-width:560px;margin:8px auto 0}
.badge{display:inline-block;background:var(--brand2);color:var(--brand);padding:2px 12px;border-radius:99px;font-size:.85rem;margin-top:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.05rem}
.card small{color:var(--muted)}
.tag{align-self:flex-start;background:var(--brand2);color:var(--brand);font-size:.78rem;padding:1px 10px;border-radius:99px}
.btns{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.btns a{flex:1;text-align:center;padding:8px;border-radius:9px;text-decoration:none;font-size:.92rem;border:1px solid var(--brand);color:var(--brand)}
.btns a.main{background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px}
h2{margin:8px 0 14px;font-size:1.3rem;border-right:4px solid var(--brand);padding-right:10px}
.sol{background:var(--brand);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 0 40px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">sailaa vet</div>
  <p>مكتبة دروس PDF مجانية لطلبة الجامعة. حمّل، ذاكر، وتفوّق.</p>
  <span class="badge">مجاني 100%</span>
</header>

<div class="tools"><input id="q" type="search" placeholder="ابحث عن درس أو مادة…" aria-label="بحث"></div>
<div class="chips" id="chips"></div>
<h2 id="lessons">الدروس</h2>
<div class="grid" id="list"></div>

<h2 id="exams">امتحانات السنوات السابقة</h2>
<div class="chips" id="echips"></div>
<div class="grid" id="elist"></div>

<footer>© sailaa vet — محتوى تعليمي مجاني للطلبة</footer>
</div>

<script>
// ===== لإضافة درس جديد: أضف سطرًا هنا وضع رابط ملف PDF في url =====
const LESSONS = [
  {t:"مقدمة في التشريح البيطري",s:"التشريح",y:"السنة الأولى",url:"#"},
  {t:"الجهاز العظمي للحيوانات الأليفة",s:"التشريح",y:"السنة الأولى",url:"#"},
  {t:"فسيولوجيا الجهاز الدوري",s:"الفسيولوجيا",y:"السنة الثانية",url:"#"},
  {t:"فسيولوجيا الجهاز الهضمي للمجترات",s:"الفسيولوجيا",y:"السنة الثانية",url:"#"},
  {t:"أساسيات علم الأدوية",s:"الأدوية",y:"السنة الثالثة",url:"#"},
  {t:"المضادات الحيوية في الطب البيطري",s:"الأدوية",y:"السنة الثالثة",url:"#"},
  {t:"علم الأحياء الدقيقة العام",s:"الأحياء الدقيقة",y:"السنة الثانية",url:"#"},
  {t:"علم الطفيليات: الديدان والحشرات",s:"الطفيليات",y:"السنة الثالثة",url:"#"},
  {t:"مبادئ الجراحة البيطرية",s:"الجراحة",y:"السنة الرابعة",url:"#"}
];
let cat="الكل";
const list=document.getElementById("list"),chips=document.getElementById("chips"),q=document.getElementById("q");
const cats=["الكل",...new Set(LESSONS.map(l=>l.s))];
function esc(x){return x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function drawChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
function draw(){
  const k=q.value.trim().toLowerCase();
  const r=LESSONS.filter(l=>(cat==="الكل"||l.s===cat)&&(l.t+l.s).toLowerCase().includes(k));
  list.innerHTML=r.length?r.map(l=>`<div class="card"><span class="tag">${esc(l.s)}</span><h3>${esc(l.t)}</h3><small>${esc(l.y)} · PDF</small><div class="btns"><a class="main" href="${esc(l.url)}" target="_blank" rel="noopener">عرض</a><a href="${esc(l.url)}" target="_blank" rel="noopener">تحميل</a></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة.</div>`;
}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;drawChips();draw()});
q.addEventListener("input",draw);
drawChips();draw();

// ===== امتحانات السنوات السابقة: أضف سطرًا لكل امتحان (sol:true إن كان مع التصحيح) =====
const EXAMS=[
  {t:"امتحان التشريح البيطري",s:"التشريح",y:"2025",sol:true,url:"#"},
  {t:"امتحان فسيولوجيا الجهاز الدوري",s:"الفسيولوجيا",y:"2025",url:"#"},
  {t:"امتحان علم الأدوية",s:"الأدوية",y:"2024",sol:true,url:"#"},
  {t:"امتحان الأحياء الدقيقة",s:"الأحياء الدقيقة",y:"2024",url:"#"},
  {t:"امتحان الطفيليات",s:"الطفيليات",y:"2023",url:"#"},
  {t:"امتحان الجراحة البيطرية",s:"الجراحة",y:"2023",sol:true,url:"#"}
];
let ey="الكل";
const ech=document.getElementById("echips"),elist=document.getElementById("elist");
const eyears=["الكل",...[...new Set(EXAMS.map(e=>e.y))].sort().reverse()];
function drawEChips(){ech.innerHTML=eyears.map(c=>`<button class="chip ${c===ey?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
function drawE(){
  const k=q.value.trim().toLowerCase();
  const r=EXAMS.filter(e=>(ey==="الكل"||e.y===ey)&&(e.t+e.s).toLowerCase().includes(k));
  elist.innerHTML=r.length?r.map(e=>`<div class="card"><span class="tag">${esc(e.y)}</span><h3>${esc(e.t)}</h3><small>${esc(e.s)} · PDF${e.sol?" · مع التصحيح":""}</small><div class="btns"><a class="main" href="${esc(e.url)}" target="_blank" rel="noopener">عرض</a><a href="${esc(e.url)}" target="_blank" rel="noopener">تحميل</a></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">لا توجد امتحانات مطابقة.</div>`;
}
ech.addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;ey=b.dataset.c;drawEChips();drawE()});
q.addEventListener("input",drawE);
drawEChips();drawE();
</script>
</body>
</html>
